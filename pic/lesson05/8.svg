</g>
<g class="message" data-from="A" data-to="Loop" data-label="遇到 await：我自己先挂起，CPU 让给你！" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="382.05500000000006" y1="170" x2="137.377" y2="170" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <rect x="137.216" y="151.85" width="245" height="16.3" rx="2" ry="2" fill="var(--bg)" />
