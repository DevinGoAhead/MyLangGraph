  <rect x="193.716" y="71.85" width="132" height="16.3" rx="2" ry="2" fill="var(--bg)" />
  <text x="259.716" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">开始执行 call_model_A</text>
</g>
<g class="message" data-from="A" data-to="API" data-label="发出请求 A (预计耗时 3s)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="382.05500000000006" y1="130" x2="744.7710000000002" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
