</g>
<g class="message" data-from="API" data-to="B" data-label="收到结果 B (唤醒 B 继续往下 return)" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="744.7710000000002" y1="400" x2="537.5150000000001" y2="400" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <rect x="539.1430000000001" y="381.85" width="204" height="16.3" rx="2" ry="2" fill="var(--bg)" />
  <text x="641.1430000000001" y="390" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">收到结果 B (唤醒 B 继续往下 return)</text>
</g>
<g class="note" data-position="over" data-actors="Loop,B">
  <polygon points="215.02800000000002,178 453.86400000000003,178 459.86400000000003,184 459.86400000000003,201 215.02800000000002,201" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="453.86400000000003,178 459.86400000000003,184 453.86400000000003,184" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="337.446" y="189.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">第 0.01 秒：线程完全没卡死，立刻切去跑 B</text>
</g>
<g class="note" data-position="over" data-actors="Loop,API">
  <polygon points="289.8470000000001,313 586.301,313 592.301,319 592.301,336 289.8470000000001,336" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="586.301,313 592.301,319 586.301,319" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
