</g>
<g class="message" data-from="B" data-to="API" data-label="发出请求 B (预计耗时 3s)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="537.5150000000001" y1="265" x2="744.7710000000002" y2="265" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <rect x="568.1430000000001" y="246.85" width="146" height="16.3" rx="2" ry="2" fill="var(--bg)" />
  <text x="641.1430000000001" y="255" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">发出请求 B (预计耗时 3s)</text>
</g>
<g class="message" data-from="B" data-to="Loop" data-label="遇到 await：我也先挂起等待！" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="537.5150000000001" y1="305" x2="137.377" y2="305" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <rect x="247.44600000000003" y="286.85" width="180" height="16.3" rx="2" ry="2" fill="var(--bg)" />
